<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SiteGen AI{% endblock %}</title>
    <meta name="description" content="{% block description %}AI-powered website builder. Create stunning websites using natural language in any language.{% endblock %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/main.css">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Navigation -->
    {% block navbar %}
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="/" class="nav-logo">
                <span class="logo-icon"><i class="fas fa-bolt"></i></span>
                <span class="logo-text">SiteGen<span class="text-gradient">AI</span></span>
            </a>
            <div class="nav-links" id="nav-links">
                {% if user %}
                <a href="/dashboard" class="nav-link">
                    <i class="fas fa-th-large"></i> Dashboard
                </a>
                <a href="/builder" class="nav-link">
                    <i class="fas fa-magic"></i> Builder
                </a>
                <div class="nav-user">
                    <div class="user-avatar" id="user-menu-toggle">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="user-dropdown" id="user-dropdown">
                        <div class="dropdown-header">
                            <span class="dropdown-name">{{ user.full_name or user.username }}</span>
                            <span class="dropdown-email">{{ user.email }}</span>
                        </div>
                        <div class="dropdown-divider"></div>
                        <a href="#" class="dropdown-item" id="theme-toggle">
                            <i class="fas fa-moon"></i> Toggle Theme
                        </a>
                        <a href="#" class="dropdown-item" onclick="logout()">
                            <i class="fas fa-sign-out-alt"></i> Logout
                        </a>
                    </div>
                </div>
                {% else %}
                <a href="/login" class="nav-link">Login</a>
                <a href="/register" class="btn btn-primary btn-sm">Get Started</a>
                {% endif %}
            </div>
            <button class="nav-toggle" id="nav-toggle">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </nav>
    {% endblock %}

    <!-- Main Content -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <script src="/static/js/main.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
